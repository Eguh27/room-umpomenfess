  - main [ref=f22e18]:
    - article [ref=f22e19]:
      - paragraph [ref=f22e20]: kebijakan
      - heading "Privasi" [level=1] [ref=f22e21]
      - paragraph [ref=f22e22]:
        - text: Ringkasan jujur tentang data yang lalui room ini. Baca bersama
        - link "batas anonimitas" [ref=f22e23] [cursor=pointer]:
          - /url: /batas-anonimitas
        - text: .
      - heading "Yang disimpan" [level=2] [ref=f22e24]
      - list [ref=f22e25]:
        - listitem [ref=f22e26]:
          - strong [ref=f22e27]: Isi pesan dan handle Guest
          - text: di database Supabase selama room aktif (7 hari) plus 15 hari arsip, lalu dihapus permanen beserta subjek room.
        - listitem [ref=f22e28]:
          - strong [ref=f22e29]: Password room
          - text: disimpan berupa hash, bukan teks asli. Password tampil sekali saat dibuat atau diganti.
        - listitem [ref=f22e30]:
          - strong [ref=f22e31]: Alamat jaringan (IP) dalam versi hash
          - text: untuk melawan tebak-tebakan password — hash HMAC, alamat aslinya tidak pernah disimpan atau ditulis di log aplikasi. Untuk koneksi IPv6, satu subnet (/64) menghasilkan hash yang sama. Catatan gagal password ini digusur dari database setelah 24 jam.
        - listitem [ref=f22e32]:
          - strong [ref=f22e33]: Akun Host
          - text: (email, password ter-hash, tier) selama akun masih ada. Menambahkan akun artinya menambah data.
      - heading "Yang disimpan di browsermu" [level=2] [ref=f22e34]
      - list [ref=f22e35]:
        - listitem [ref=f22e36]:
          - strong [ref=f22e37]: Sesi anonim
          - text: untuk mengabstraksi tiap Guest — ini yang membuat handle acak per room tetap sama saat balik ke room yang sama. Hilang bila storage situs dibersihkan.
        - listitem [ref=f22e38]:
          - strong [ref=f22e39]: Penanda room yang sudah dibaca
          - text: di
          - code [ref=f22e40]: localStorage
          - text: supaya daftar "Ruang saya" menandai pesan baru.
      - heading "Yang tidak pernah diberikan ke Host" [level=2] [ref=f22e41]
      - paragraph [ref=f22e42]: Identitas Guest (akun internal per browser) disimpan di tabel terpisah yang tidak pernah terbaca Host — termasuk lewat daftar member maupun pesan. Host hanya melihat handle acak sembilan karakter; lencana HOST/VERIFIED datang dari server, bukan dari teks nama.
      - heading "Room publik" [level=2] [ref=f22e43]
      - paragraph [ref=f22e44]: Room publik tampil di FYP sebagai metadata saja (nama, deskripsi, kategori, jumlah anggota). Isi chat baru terbaca setelah join. Siapa pun yang join dapat membaca dan menyalin isi chat, jadi jangan menulis data pribadi di room publik.
      - heading "Tulis lewat fungsi, bukan pintu terbuka" [level=2] [ref=f22e45]
      - paragraph [ref=f22e46]: "Semua penulisan data lewat satu pintu: fungsi tertutup di database. Tabel inti tidak mengizinkan client menambah, mengubah, atau menghapus langsung — Guest hanya bisa menyentuh room yang diikutinya."
      - heading "Pihak ketiga yang bekerja di halaman ini" [level=2] [ref=f22e47]
      - list [ref=f22e48]:
        - listitem [ref=f22e49]:
          - strong [ref=f22e50]: Supabase
          - text: (database, otentikasi anonim, Realtime) dan
          - strong [ref=f22e51]: Vercel
          - text: (hosting) menjalankan layanan ini.
        - listitem [ref=f22e52]:
          - strong [ref=f22e53]: Cloudflare Turnstile
          - text: dicek sekali saat masuk room untuk memastikan manusia, bukan bot. Widget ini tidak membaca isi percakapan — hanya halaman masuk yang menyentuhnya.
        - listitem [ref=f22e54]:
          - strong [ref=f22e55]: Google Fonts
          - text: menyuguhi huruf-huruf situs (font ke browsermu, bukan sebaliknya).
      - heading "Yang berada di luar kendali aplikasi" [level=2] [ref=f22e56]
      - paragraph [ref=f22e57]: Layanan infrastruktur di atas menyimpan log teknis sesuai kebijakan mereka masing-masing, seperti catatan alamat jaringan di level jaringan. Log itu tidak murni milik aplikasi ini; sifatnya samar dan tidak berisi isi percakapan.
      - paragraph [ref=f22e58]:
        - text: Situs
        - link "Menfess, situs utama" [ref=f22e59] [cursor=pointer]:
          - /url: https://umpomenfess.my.id
          - text: umpomenfess.my.id ↗
        - text: beroperasi terpisah; kebijakan masing-masing subsite tidak saling menetapkan.
