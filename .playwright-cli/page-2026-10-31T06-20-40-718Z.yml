  - main [ref=f11e21]:
    - article [ref=f11e22]:
      - paragraph [ref=f11e23]: kebijakan
      - heading "Aturan konten" [level=1] [ref=f11e24]
      - paragraph [ref=f11e25]:
        - text: Patokan penegakan pada room (privat maupun publik). Baca bersama
        - link "privasi" [ref=f11e26] [cursor=pointer]:
          - /url: /privasi
        - text: dan
        - link "batas anonimitas" [ref=f11e27] [cursor=pointer]:
          - /url: /batas-anonimitas
        - text: .
      - paragraph [ref=f11e29]:
        - strong [ref=f11e30]: Status moderasi.
        - text: Tombol Laporkan dan antrean Admin masih dalam pengembangan. Aturan di halaman ini menjadi patokan saat fitur moderasi aktif.
      - heading "Prinsipnya" [level=2] [ref=f11e31]
      - paragraph [ref=f11e32]: Room dibuat untuk obrolan berbatas waktu yang tetap dalam batas sopan. Host bertanggung jawab pada room-nya (bisa menolak dan mengeluarkan pengganggu), Guest bisa melaporkan isi yang menyimpang, dan Admin platform menindaklanjuti pada room maupun akun.
      - heading "Yang tidak diterima" [level=2] [ref=f11e33]
      - list [ref=f11e34]:
        - listitem [ref=f11e35]: "Konten ilegal: penipuan, SARA, kekerasan, atau konten anak."
        - listitem [ref=f11e36]: "Perundungan: serangan pribadi, menghina, atau menekan orang lain."
        - listitem [ref=f11e37]: "Doxxing: menyebar identitas, alamat, atau data pribadi orang."
        - listitem [ref=f11e38]: "Spam: iklan, promosi, atau pengulangan yang mengganggu percakapan."
        - listitem [ref=f11e39]: Penyamaran identitas orang atau organisasi lain.
      - heading "Jalan penegakan" [level=2] [ref=f11e40]
      - list [ref=f11e41]:
        - listitem [ref=f11e42]:
          - strong [ref=f11e43]: Host
          - text: menolak, mengeluarkan, atau menutup room-nya sendiri — tanpa menunggu laporan.
        - listitem [ref=f11e44]:
          - strong [ref=f11e45]: Guest
          - text: menekan tombol Laporkan dan memilih alasan (spam, perundungan, melanggar hukum, lainnya). Identitas pelapor tidak ditampilkan ke Host maupun Admin; server memakai penanda unik untuk mencegah laporan ganda.
        - listitem [ref=f11e46]: 3 laporan unik — pelapor berbeda, satu pelapor dihitung sekali — membuat room publik otomatis turun dari daftar FYP (status tersembunyi) sampai selesai ditinjau.
        - listitem [ref=f11e47]:
          - strong [ref=f11e48]: Admin
          - text: "meninjau laporan dengan metadata room: membiarkan, menurunkan dari FYP, memblokir dari FYP selamanya, menutup room, atau menangguhkan akun."
      - heading "Tindakan pada konten melanggar hukum" [level=2] [ref=f11e49]
      - paragraph [ref=f11e50]: Penghapusan konten berlangsung pada level room dan akun — pesan tidak disunting satu-satu, jadi room yang tidak layak ditutup atau diblokir daripada disortir per baris. Isi chat tetap tersimpan pada umurnya (aktif 7 hari, arsip 15 hari) lalu terhapus permanen. Permintaan takedown dari pihak terkait diteruskan ke kanal kontak pengelola untuk ditindak admin.
      - heading "Soal pelaporan" [level=2] [ref=f11e51]
      - list [ref=f11e52]:
        - listitem [ref=f11e53]: Identitas pelapor tidak pernah tampil di UI mana pun; server hanya memakai penanda unik.
        - listitem [ref=f11e54]: Room privat hanya bisa dilaporkan oleh membernya; Host tidak bisa melaporkan room sendiri.
        - listitem [ref=f11e55]: Laporan ganda dari pelapor yang sama tidak mengubah hitungan — hitungan bergerak karena jumlah pelapor unik, bukan jumlah laporan.
        - listitem [ref=f11e56]: Keputusan Admin selalu tercermin di audit log konsol.
