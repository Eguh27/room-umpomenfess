  - main [ref=f1e21]:
    - article [ref=f1e22]:
      - paragraph [ref=f1e23]: kebijakan
      - heading "Aturan konten" [level=1] [ref=f1e24]
      - paragraph [ref=f1e25]:
        - text: Patokan penegakan pada room (privat maupun publik). Baca bersama
        - link "privasi" [ref=f1e26] [cursor=pointer]:
          - /url: /privasi
        - text: dan
        - link "batas anonimitas" [ref=f1e27] [cursor=pointer]:
          - /url: /batas-anonimitas
        - text: .
      - paragraph [ref=f1e29]:
        - strong [ref=f1e30]: Status moderasi.
        - text: Tombol Laporkan dan antrean Admin masih dalam pengembangan. Aturan di halaman ini menjadi patokan saat fitur moderasi aktif.
      - heading "Prinsipnya" [level=2] [ref=f1e31]
      - paragraph [ref=f1e32]: Room dibuat untuk obrolan berbatas waktu yang tetap dalam batas sopan. Host bertanggung jawab pada room-nya (bisa menolak dan mengeluarkan pengganggu), Guest bisa melaporkan isi yang menyimpang, dan Admin platform menindaklanjuti pada room maupun akun.
      - heading "Yang tidak diterima" [level=2] [ref=f1e33]
      - list [ref=f1e34]:
        - listitem [ref=f1e35]: "Konten ilegal: penipuan, SARA, kekerasan, atau konten anak."
        - listitem [ref=f1e36]: "Perundungan: serangan pribadi, menghina, atau menekan orang lain."
        - listitem [ref=f1e37]: "Doxxing: menyebar identitas, alamat, atau data pribadi orang."
        - listitem [ref=f1e38]: "Spam: iklan, promosi, atau pengulangan yang mengganggu percakapan."
        - listitem [ref=f1e39]: Penyamaran identitas orang atau organisasi lain.
      - heading "Jalan penegakan" [level=2] [ref=f1e40]
      - list [ref=f1e41]:
        - listitem [ref=f1e42]:
          - strong [ref=f1e43]: Host
          - text: menolak, mengeluarkan, atau menutup room-nya sendiri — tanpa menunggu laporan.
        - listitem [ref=f1e44]:
          - strong [ref=f1e45]: Guest
          - text: menekan tombol Laporkan dan memilih alasan (spam, perundungan, melanggar hukum, lainnya). Identitas pelapor tidak ditampilkan ke Host maupun Admin; server memakai penanda unik untuk mencegah laporan ganda.
        - listitem [ref=f1e46]: 3 laporan unik — pelapor berbeda, satu pelapor dihitung sekali — membuat room publik otomatis turun dari daftar FYP (status tersembunyi) sampai selesai ditinjau.
        - listitem [ref=f1e47]:
          - strong [ref=f1e48]: Admin
          - text: "meninjau laporan dengan metadata room: membiarkan, menurunkan dari FYP, memblokir dari FYP selamanya, menutup room, atau menangguhkan akun."
      - heading "Tindakan pada konten melanggar hukum" [level=2] [ref=f1e49]
      - paragraph [ref=f1e50]: Penghapusan konten berlangsung pada level room dan akun — pesan tidak disunting satu-satu, jadi room yang tidak layak ditutup atau diblokir daripada disortir per baris. Isi chat tetap tersimpan pada umurnya (aktif 7 hari, arsip 15 hari) lalu terhapus permanen. Permintaan takedown dari pihak terkait diteruskan ke kanal kontak pengelola untuk ditindak admin.
      - heading "Soal pelaporan" [level=2] [ref=f1e51]
      - list [ref=f1e52]:
        - listitem [ref=f1e53]: Identitas pelapor tidak pernah tampil di UI mana pun; server hanya memakai penanda unik.
        - listitem [ref=f1e54]: Room privat hanya bisa dilaporkan oleh membernya; Host tidak bisa melaporkan room sendiri.
        - listitem [ref=f1e55]: Laporan ganda dari pelapor yang sama tidak mengubah hitungan — hitungan bergerak karena jumlah pelapor unik, bukan jumlah laporan.
        - listitem [ref=f1e56]: Keputusan Admin selalu tercermin di audit log konsol.
